services:
  postgres-test:
    image: postgres:16-alpine
    container_name: academy_postgres_test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: academy_test
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy"]
      interval: 5s
      timeout: 5s
      retries: 5
