name: CI

on:
  # Każdy push na dowolny branch — feedback od razu, nie dopiero przy PR.
  push:
    branches: ["**"]
  # PR dodatkowo testuje wynik merge'a z main (wyłapuje konflikty semantyczne,
  # których sam branch nie pokazuje).
  pull_request:
    branches: [main]

# Nowy push na ten sam ref anuluje poprzedni przebieg — oszczędza minuty
# Actions przy serii szybkich pushy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── API ──────────────────────────────────────────────────────────────────
  api:
    name: API — lint, build, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: academy_test
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://academy:academy@localhost:5432/academy_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      # Testy integracyjne ładują cały AppModule, więc potrzebują kompletu
      # zmiennych (unit testy mockują Stripe i Resend, integracyjne nie).
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      RESEND_API_KEY: re_ci_dummy
      MAIL_FROM: noreply@academy.pl

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Lint
        run: npm run lint --workspace=apps/api

      - name: Build
        run: npm run build --workspace=apps/api

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Unit tests
        run: npm test --workspace=apps/api

      - name: Integration tests
        run: npm run test:e2e --workspace=apps/api

  # ─── Web ──────────────────────────────────────────────────────────────────
  web:
    name: Web — lint, build, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Build
        run: npm run build --workspace=apps/web

      - name: Unit tests
        working-directory: apps/web
        run: npx vitest run --passWithNoTests

  # ─── E2E ──────────────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [api, web]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: academy_test
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://academy:academy@localhost:5432/academy_test
      JWT_SECRET: ci-e2e-secret
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret
      JWT_ACCESS_EXPIRES: 15m
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: academy-materials
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      TEST_ADMIN_EMAIL: admin@test.academy
      TEST_ADMIN_PASSWORD: Admin1234!
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      RESEND_API_KEY: re_ci_dummy
      MAIL_FROM: noreply@academy.pl
      ADMIN_EMAIL: admin@academy.pl
      # Limity auth podniesione — zestaw E2E loguje się wielokrotnie z jednego IP
      AUTH_THROTTLE_LIMIT: "1000"
      MAIL_THROTTLE_LIMIT: "1000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Seed database
        run: node ../../e2e/helpers/seed.js
        working-directory: apps/api

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Start API
        run: node apps/api/dist/main.js &
        env:
          API_PORT: 3000

      - name: Build Web
        run: npm run build --workspace=apps/web

      - name: Serve Web
        run: npx vite preview --port 5173 &
        working-directory: apps/web

      - name: Wait for services
        run: |
          npx wait-on tcp:localhost:3000 --timeout 30000
          npx wait-on http://localhost:5173 --timeout 30000

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
