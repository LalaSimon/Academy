# Poświadczenia infrastruktury celowo NIE mają wartości domyślnych (`:?` zamiast
# `:-`). Wcześniej brak zmiennej cicho podstawiał `academy` / `minioadmin`, więc
# wdrożenie bez konfiguracji wstawało ze znanym hasłem. Teraz compose odmówi
# startu z czytelnym komunikatem — ten sam wzorzec co `getOrThrow` w API.
services:
  postgres:
    image: postgres:16-alpine
    container_name: academy_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?wymagane — ustaw w .env (patrz .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?wymagane — ustaw w .env (patrz .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wymagane — ustaw w .env (patrz .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?wymagane — ustaw w .env (patrz .env.example)}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: academy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: academy_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?wymagane — ustaw w .env (patrz .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?wymagane — ustaw w .env (patrz .env.example)}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: academy_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./packages/shared/src:/app/packages/shared/src
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?wymagane — ustaw w .env (patrz .env.example)}:${POSTGRES_PASSWORD:?wymagane — ustaw w .env (patrz .env.example)}@postgres:5432/${POSTGRES_DB:?wymagane — ustaw w .env (patrz .env.example)}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      FRONTEND_URL: http://localhost:5173
      # Zestaw E2E loguje się kilkanaście razy w minutę z jednego IP.
      # Produkcja nie ustawia tych zmiennych i zostaje przy 10/min i 3/min.
      AUTH_THROTTLE_LIMIT: "1000"
      MAIL_THROTTLE_LIMIT: "1000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: academy_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages/shared/src:/app/packages/shared/src
    environment:
      VITE_HOST: "0.0.0.0"
      VITE_HMR_HOST: "localhost"
      VITE_API_TARGET: "http://api:3000"
    depends_on:
      - api

  stripe:
    image: stripe/stripe-cli:latest
    container_name: academy_stripe
    restart: unless-stopped
    command: listen --api-key ${STRIPE_SECRET_KEY} --forward-to http://api:3000/api/v1/payments/webhook/stripe --skip-verify
    volumes:
      - ${HOME}/.config/stripe:/root/.config/stripe
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
